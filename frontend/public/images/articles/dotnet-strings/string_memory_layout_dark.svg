<text x="55" y="745" fill="#adc2ce" font-size="19" font-weight="450" font-family="Arial, Helvetica, sans-serif" text-anchor="start">Relative object layout on x64 CoreCLR; row heights are schematic, not proportional to byte size.</text>
<text x="55" y="772" fill="#adc2ce" font-size="19" font-weight="450" font-family="Arial, Helvetica, sans-serif" text-anchor="start">Literal values may be interned; the local reference may reside in a register rather than on the stack.</text>
