<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="790" viewBox="0 0 1400 790" role="img" aria-labelledby="title desc">
<title id="title">x64 layout of a four-character .NET string</title>
<desc id="desc">The stack may hold one 8-byte reference. A newly allocated four-character string has a 32-byte managed-heap allocation: 8-byte object header, 8-byte method table pointer, 4-byte length, 8 bytes for UTF-16 characters, 2-byte zero terminator and 2-byte alignment padding.</desc>
<defs><marker id="arrowhead" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11Z" fill="#ca9ee3"/></marker></defs>
