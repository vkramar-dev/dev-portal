<text x="54" y="57" fill="#eca86e" font-size="26" font-weight="700" font-family="Arial, Helvetica, sans-serif" text-anchor="start">STRING MEMORY LAYOUT</text>
<text x="54" y="107" fill="#f1f7f9" font-size="32" font-weight="650" font-family="Consolas, Menlo, monospace" text-anchor="start">string str = &quot;.NET&quot;;</text>
<text x="1324" y="106" fill="#adc2ce" font-size="20" font-weight="450" font-family="Arial, Helvetica, sans-serif" text-anchor="end">x64 · illustrative</text>
