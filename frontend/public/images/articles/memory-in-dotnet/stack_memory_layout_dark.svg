<svg xmlns="http://www.w3.org/2000/svg" width="1580" height="1000" viewBox="0 0 1580 1000" role="img" aria-labelledby="title desc">
<title id="title">Thread stack and managed heap layout of local variables in .NET</title>
<desc id="desc">An illustrative x64 diagram with precisely sized 8-byte slots. The stack contains int number, decimal price, an eight-byte reference to OrderClass, and a 24-byte OrderStruct. The managed heap contains the forty-byte OrderClass object. Blue denotes value data, purple denotes reference data, and crosshatching denotes padding.</desc>
